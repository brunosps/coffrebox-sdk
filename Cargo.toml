[workspace]
resolver = "2"
members = [
    "crates/coffrebox-core",
    "crates/coffrebox-wasm",
    "crates/coffrebox-client",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Bruno Santos"]
repository = "https://github.com/brunosps/coffrebox-sdk"

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.chacha20]
opt-level = 2

[profile.dev.package.poly1305]
opt-level = 2

[profile.dev.package.curve25519-dalek]
opt-level = 2

[workspace.dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
crc32fast = "1.4"
ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "fast", "zeroize"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
hex = "0.4"
hkdf = "0.13"
hpke = { version = "0.15", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
proptest = "1.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2.6"
thiserror = "2"
tracing = "0.1"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["serde"] }
wasm-bindgen = "0.2"
x25519-dalek = { version = "3", default-features = false, features = ["precomputed-tables", "static_secrets", "zeroize"] }
zeroize = { version = "1", features = ["derive"] }
