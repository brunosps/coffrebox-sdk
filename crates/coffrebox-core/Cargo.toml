[package]
name = "coffrebox-core"
version.workspace = true
edition.workspace = true
rust-version = "1.89"
authors = ["Bruno Santos"]
license = "MIT"
description = "Cryptography and formats of Coffrebox, a zero-knowledge secrets vault (no I/O, wasm32-ready)."
repository = "https://github.com/brunosps/coffrebox-sdk"
homepage = "https://github.com/brunosps/coffrebox-sdk"
documentation = "https://docs.rs/coffrebox-core"
readme = "README.md"
keywords = ["coffrebox", "zero-knowledge", "hpke", "encryption", "secrets"]
categories = ["cryptography", "wasm"]

[dependencies]
argon2 = { workspace = true }
base64 = { workspace = true }
chacha20poly1305 = { workspace = true }
crc32fast = { workspace = true }
ed25519-dalek = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
hkdf = { workspace = true }
hpke = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
unicode-normalization = { workspace = true }
uuid = { workspace = true }
x25519-dalek = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["sys_rng", "wasm_js"] }

[dev-dependencies]
proptest = { workspace = true }
